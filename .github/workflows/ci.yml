name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["23.8.0", "24", "26"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test --run
      - run: yarn lint
      - run: yarn build
      - run: node scripts/profile-signature-distribution-smoke.mjs .
      - name: Packed distribution
        run: |
          package=$(npm pack --silent)
          npm install --prefix "$RUNNER_TEMP/psig-package" "$PWD/$package" --no-audit --no-fund
          node scripts/profile-signature-distribution-smoke.mjs "$RUNNER_TEMP/psig-package/node_modules/@lepistabioinformatics/mycelium-sdk"
